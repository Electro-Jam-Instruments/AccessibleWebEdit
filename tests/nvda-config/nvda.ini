# AccessibleWebEdit — pinned NVDA configuration profile
#
# Selects the built-in "No speech" synthesizer so speech flows through the
# pipeline and into the session log WITHOUT needing an audio device, and turns
# off the noise that would interfere with an unattended capture run (update
# checks, the welcome dialog, exit-confirm prompt).
#
# This file maps to %nvda-config%\nvda.ini. Deploy it to C:\awe\nvda-config
# (see this directory's README.md) and point NVDA at it with:
#   nvda.exe -c C:\awe\nvda-config ...
#
# Format is NVDA's ConfigObj (INI-like). Keys mirror NVDA's documented config
# sections; the schema version is informational and tolerated across the
# 2024/2025 line. Verify against the installed NVDA version on first real run
# (TASK-00a open item #1).

schemaVersion = 12

[speech]
	# "No speech" synth — utterances are logged but never sent to an audio device.
	synth = silence
	# Keep symbol/character verbosity predictable for diffable captures.
	symbolLevel = 100

[speech.silence]
	# The No-speech synth has no tunable voice params; section present for clarity.

[general]
	# Fully unattended: no update checks, no usage stats, no welcome dialog.
	checkForUpdatesOnStartup = False
	askToExit = False
	playStartAndExitSounds = False
	showWelcomeDialogAtStartup = False
	saveConfigurationOnExit = False
	# Verbose logging is set per-run on the command line (--log-level=12); leave
	# the persisted level at info so the file itself stays generic.
	loggingLevel = INFO

[update]
	autoCheck = False
	startupNotification = False

[featureFlag]
	# No first-run / what's-new surprises during capture.

[upgrade]
	newLaptopKeyboardLayout = False
